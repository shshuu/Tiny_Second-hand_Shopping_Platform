<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tiny Market</title><style>body{max-width:900px;margin:2rem auto;padding:0 1rem;font-family:system-ui}nav{display:flex;gap:1rem;align-items:center;border-bottom:1px solid #ddd;padding-bottom:1rem}a{color:#1254a8}input,textarea,select{display:block;width:100%;max-width:480px;margin:.3rem 0 1rem;padding:.6rem}button{padding:.6rem 1rem;background:#1254a8;color:#fff;border:0;border-radius:.25rem}.card{border:1px solid #ddd;padding:1rem;margin:1rem 0;border-radius:.4rem}.errorlist{color:#b00020}</style></head><body><nav><a href="{% url 'product_list' %}">Tiny Market</a>{% if user.is_authenticated %}<a href="{% url 'product_create' %}">상품 등록</a><a href="{% url 'wallet' %}">내 지갑</a><form action="{% url 'logout' %}" method="post">{% csrf_token %}<button>로그아웃</button></form>{% else %}<a href="{% url 'login' %}">로그인</a><a href="{% url 'signup' %}">회원가입</a>{% endif %}</nav>{% for message in messages %}<p>{{ message }}</p>{% endfor %}{% block content %}{% endblock %}</body></html>
