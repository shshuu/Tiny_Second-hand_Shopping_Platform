{% extends 'market/base.html' %}{% block content %}<h1>카테고리 관리</h1><form method="post">{% csrf_token %}<input name="name" placeholder="이름" required><input name="slug" placeholder="slug" required><label><input type="checkbox" name="is_active" checked> 활성</label><button>생성</button></form>{% for category in categories %}<article class="card"><form method="post">{% csrf_token %}<input type="hidden" name="id" value="{{ category.id }}"><input name="name" value="{{ category.name }}" required><input name="slug" value="{{ category.slug }}" required><label><input type="checkbox" name="is_active" {% if category.is_active %}checked{% endif %}> 활성</label><button>저장</button></form></article>{% endfor %}{% endblock %}
